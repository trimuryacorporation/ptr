services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
  backend:
    build: ./backend
    command: npm run dev
    ports: ["5000:5000"]
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/trimurya
    depends_on: [mongo]
volumes:
  mongo-data:
